<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My App</title>
  </head>
  <body>
    <h1>My App</h1>

    <div style="border: 1px solid black; display: inline-block">
      <h3 style="margin-top: 0px">Network Monitor</h3>
      <table id="networkMonitorTable" style="border: none">
        <thead>
          <th>Server ID</th>
          <th>Connection count</th>
        </thead>
      </table>
    </div>

    <h3>Talk to my server:</h3>
    <!-- <textarea id="msgInput">Hello, how are you?</textarea> -->
    <textarea id="msgInput">
arnmodwpbcfnpkkdghtikbneqyxuzhcdlfcpijdeldiytmnwclqawndxievhorlyxdrajuqesutwrlgdcstgmekifiurxpdxdaol</textarea
    >
    <button id="sendButton">Send</button>
    <button id="clearButton">Clear Log</button>
    <button id="testButton">Connect Network Monitor</button>

    <pre id="responseLogArea"></pre>

    <script>
      const msgInput = document.getElementById('msgInput');
      const sendButton = document.getElementById('sendButton');
      const clearButton = document.getElementById('clearButton');
      const testButton = document.getElementById('testButton');
      const responseLogArea = document.getElementById('responseLogArea');
      const netMonTable = document.getElementById('networkMonitorTable');

      let controller = null;

      sendButton.addEventListener('click', () => {
        if (controller) {
          controller.abort();
        }

        controller = new AbortController();
        fetch('http://localhost:5000/', {
          method: 'POST',
          headers: {
            'content-type': 'text/plain',
          },
          body: msgInput.value,
          signal: controller.signal,
        })
          .then(async (response) => {
            const streamReader = response.body.getReader();
            const logDisplayElement = document.createElement('div');
            logDisplayElement.style.maxWidth = '600px';
            logDisplayElement.style.overflow = 'hidden';
            logDisplayElement.style.textOverflow = 'ellipsis';
            logDisplayElement.style.whiteSpace = 'nowrap';

            responseLogArea.appendChild(logDisplayElement);

            const textDecoder = new TextDecoder('utf-8');

            let data = '';
            let keepReading = true;
            while (keepReading) {
              await streamReader.read().then(({ done, value }) => {
                logDisplayElement.textContent += textDecoder.decode(value);
                data += textDecoder.decode(value);
                keepReading = !done;
              });
            }

            logDisplayElement.title = data;
          })
          .catch((error) => {
            if (error.name !== 'AbortError') {
              console.error(error);
            }
          });
      });

      clearButton.addEventListener('click', () => {
        responseLogArea.textContent = '';
      });

      let ws = null;
      const netMonMessageParser = (event) => {
        if (event.data.includes('monitoring')) {
          const [_, serverId, connectionCount] = event.data.match(
            /^monitoring_server\#(\d+):(\d+)$/
          );

          if (!serverId || !connectionCount) {
            return;
          }

          const row = document.createElement('tr');
          const serverIdCell = document.createElement('td');
          const connectionCountCell = document.createElement('td');

          serverIdCell.textContent = serverId;
          connectionCountCell.textContent = connectionCount;

          row.append(serverIdCell);
          row.append(connectionCountCell);

          netMonTable.append(row);
        } else if (event.data.includes('connectionCount_server')) {
          const [_, serverId, connectionCount] = event.data.match(
            /^connectionCount_server\#(\d+):(\d+)$/
          );

          if (!serverId || !connectionCount) {
            return;
          }

          const allRows = document.querySelectorAll('tr');
          const rowIndexWithServerId = Array.from(allRows).findIndex(
            (el) => el.querySelectorAll('td')[0]?.textContent === serverId
          );
          const rowWithServerId = allRows[rowIndexWithServerId];

          if (!rowWithServerId) {
            return;
          }

          rowWithServerId.querySelectorAll('td')[1].textContent =
            connectionCount;
        }
      };

      testButton.addEventListener('click', () => {
        if (ws && ws.readyState === 1) {
          return;
        }
        ws = new WebSocket(`ws://localhost:8081/`);
        ws.onopen = (socket, event) => {
          console.log('WebSocket connection opened.');
        };
        ws.onmessage = netMonMessageParser;
        ws.onclose = () => {
          console.log('WebSocket connection closed.');
        };
      });
    </script>
  </body>
</html>
